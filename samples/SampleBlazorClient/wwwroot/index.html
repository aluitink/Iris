<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iris — server explorer</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
</head>

<body>
    <div id="app">
        <div class="startup-loading">Loading the Iris server explorer…</div>
    </div>

    <div id="error-view" class="hidden"></div>

    <div class="startup-loading hidden">
        <svg class="loading-spinner" viewBox="0 0 50 50">
            <circle cx="25" cy="25" r="20" fill="none" stroke-width="5"></circle>
        </svg>
        <div class="startup-loading-text">Iris</div>
    </div>

    <!-- WebCrypto signing bridge (RSA signing in the browser; the .NET WASM BCL has no usable RSA).
          Source lives in the Iris.WebCrypto library (src/Iris.WebCrypto/WebCrypto.js); this copy is
          what the site serves. It defines window.webcryptoSign (the crypto surface) and the named
          webcryptoSignBootstrap.install entry point the C# side calls. -->
    <script src="js/WebCrypto.js"></script>

    <!-- Blazor WebAssembly scripts (auto-injected by the SDK). -->
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
