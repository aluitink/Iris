# Iris — production nginx reverse proxy configuration.
#
# Place at /etc/nginx/conf.d/iris.conf on the host (or mount into an nginx container).
# The app listens on 127.0.0.1:8088 (the docker-compose published port).
#
# Prerequisites:
#   - TLS certificates provisioned (Let's Encrypt via certbot, or manual) at
#     /etc/letsencrypt/live/<domain>/fullchain.pem and privkey.pem
#   - Replace iris.example.com with the actual FQDN
#
# Key requirements (see docs/plans/production-app-deployment.md §5):
#   1. WebSocket upgrade support for the Blazor Interactive Server circuit (SignalR).
#   2. Forwarded headers (X-Forwarded-Proto, X-Forwarded-For) so the app sees https.
#   3. Long proxy_read_timeout so idle WebSocket circuits are not dropped.

# Map for the Connection header: "upgrade" when the client asks to upgrade,
# "close" otherwise. Standard nginx WebSocket pattern.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# HTTP → HTTPS redirect (catch-all for all vhosts on this server).
server {
    listen 80;
    listen [::]:80;
    server_name iris.example.com;

    # Let's Encrypt ACME challenge (certbot webroot mode).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else redirects to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name iris.example.com;

    # ---- TLS ----
    ssl_certificate     /etc/letsencrypt/live/iris.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iris.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ---- Security headers ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Content-Security-Policy: the Blazor app uses inline scripts for the .NET runtime bootstrap.
    # Adjust 'nonce-' or hash values if you add/remove inline <script> blocks.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://*.blazor.boot.dev; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss://$host; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ---- Gzip compression ----
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml text/xml image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;
    gzip_comp_level 5;

    # ---- Rate limiting (10 req/s per IP, burst of 20) ----
    limit_req zone=ap_limit burst=20 nodelay;

    # ---- Client body size (match the app's Iris:MaxRequestBodySize, default 1 MiB;
    #     media uploads may need this raised — set to 10 MiB as a safe default) ----
    client_max_body_size 10m;

    # ---- Health check endpoint (exposed for load balancers / monitoring) ----
    location /ap/v1/health {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # No rate limiting on health checks.
        limit_req off;
        access_log off;
    }

    # ---- Main application ----
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;

        # WebSocket upgrade support (required for the Blazor Interactive Server circuit):
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Forwarded headers (the app's UseForwardedHeaders reads these):
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived connections: the WebSocket circuit is a single connection that stays open
        # for the life of the browser tab. Raise the proxy read timeout so nginx does not
        # close an idle circuit (the default 60 s is too short for a user who leaves the tab
        # open without interacting).
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 10s;

        # Buffering: keep default for HTML/JSON; disable for large media responses if needed.
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
    }

    # ---- Static assets: serve directly from disk for performance (optional).
    #     Uncomment if you mount the app's wwwroot into nginx and want to offload
    #     static file serving from the .NET process.
    #
    # location /_framework/ {
    #     root /var/www/iris/wwwroot;
    #     expires 1y;
    #     add_header Cache-Control "public, immutable";
    # }
    #
    # location ~* \.(css|js|svg|png|jpg|jpeg|webp|ico|woff2?)$ {
    #     root /var/www/iris/wwwroot;
    #     expires 1d;
    #     add_header Cache-Control "public";
    # }
}
