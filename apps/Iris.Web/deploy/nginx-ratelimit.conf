# Include this in the main nginx.conf http{} block (or a conf.d file loaded in http context).
# Defines the rate-limit zone used by iris.conf.
#
# 10 MB shared memory zone, key = client IP, 10 requests/second.
# The burst=20 in the location block allows short spikes (e.g., a page load with
# multiple parallel requests) without rejecting the user.

limit_req_zone $binary_remote_addr zone=ap_limit:10m rate=10r/s;
