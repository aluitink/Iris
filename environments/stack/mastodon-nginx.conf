# QA Mastodon nginx front (single published port: host 18092 -> container 8082).
#
# The EXTERNAL reverse proxy (on the other server) terminates TLS and forwards the single FQDN
# qa-mastodon.luit.ink to this host port (18092). This container does the only split the external
# proxy does NOT do: /api/v1/streaming/ (WebSocket + SSE) -> mastodon-streaming:4000, everything
# else (REST + ActivityPub + SPA) -> mastodon-web:3000.
#
# No TLS inside the container: the external proxy sets X-Forwarded-Proto: https, which is what makes
# Mastodon emit https://qa-mastodon.luit.ink IRIs. We listen on plain 8082 inside the container.
server {
    listen 8082;
    server_name _;

    # Forward the external scheme so Mastodon generates https:// IRIs.
    location / {
        proxy_pass http://mastodon-web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        client_max_body_size 200M;
    }

    # Streaming API (WebSocket + SSE) — long-lived connections.
    location /api/v1/streaming/ {
        proxy_pass http://mastodon-streaming:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
