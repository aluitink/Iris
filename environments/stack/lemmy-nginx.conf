# QA Lemmy nginx front (single published port: host 18091 -> container 8082).
#
# The EXTERNAL reverse proxy (on the other server) terminates TLS and forwards the single FQDN
# qa-lemmy.luit.ink to this host port (18091). This container does the split the external proxy does
# NOT do (path + Accept-header content negotiation):
#   /api/ + /.well-known/ + Accept: activity+json|ld+json  -> lemmy:8536 (backend)
#   /static/* + everything else                             -> lemmy-ui:1234 (UI SSR)
#
# The AP-doc rule is essential: remote instances (e.g. Iris) fetch actor/object docs with
# `Accept: application/activity+json` and MUST get JSON-LD, not the UI's HTML — if they get HTML,
# federation breaks. Browser UI requests send Accept: text/html and fall through to the UI.
#
# No TLS inside the container: the external proxy sets X-Forwarded-Proto: https, which is what makes
# the backend + UI emit https://qa-lemmy.luit.ink IRIs. We listen on plain 8082 inside the container.
upstream lemmy_backend {
    server lemmy:8536;
    keepalive 16;
}

upstream lemmy_ui {
    server lemmy-ui:1234;
    keepalive 16;
}

server {
    # Container port 8082; the external proxy targets host 18091 -> this.
    listen 8082;
    server_name _;

    # Lemmy API + ActivityPub payloads can exceed the 1MB nginx default.
    client_max_body_size 50m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # REST API.
    location /api/ {
        proxy_pass http://lemmy_backend;
        proxy_read_timeout 120s;
    }

    # Federation discovery + ActivityPub well-known documents.
    location /.well-known/ {
        proxy_pass http://lemmy_backend;
    }

    # Static UI assets (hashed bundles).
    location /static/ {
        proxy_pass http://lemmy_ui;
    }

    # ACTIVITYPUB CONTENT-NEGOTIATION: any request asking for an ActivityPub media type is an
    # actor/object document fetch from a REMOTE instance (e.g. Iris), so it goes to the backend.
    location / {
        if ($http_accept ~* "(application/activity\\+json|application/ld\\+json)") {
            proxy_pass http://lemmy_backend;
        }
        proxy_pass http://lemmy_ui;
        proxy_read_timeout 120s;
    }
}
