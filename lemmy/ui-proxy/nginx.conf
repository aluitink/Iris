# Single-port front for the Lemmy interop instance (Phase 135.1).
#
# The external nginx proxy forwards the public FQDN (lemmy.luit.ink:443) to ONE host port
# (8091). This container owns that port and splits traffic:
#
#   /api/*               -> lemmy backend (REST)
#   /.well-known/*       -> lemmy backend (nodeinfo, webfinger, activitypub discovery)
#   Accept: activity+json -> lemmy backend (ActivityPub actor/object documents)
#   /static/*            -> lemmy-ui (hashed SvelteKit/webpack assets — NOT served by the backend)
#   everything else      -> lemmy-ui SSR (pages, /u/*, /c/*, /post/*, login, ...)
#
# ACTIVITYPUB CONTENT-NEGOTIATION: the lemmy backend serves ActivityPub actor/object documents
# (Group for /c/*, Person for /u/*, Note for /comment/*, Article for /post/*) at the SAME paths
# the UI renders HTML pages at. A REMOTE instance (e.g. Iris) fetching
# https://lemmy.luit.ink/c/interop sends `Accept: application/activity+json` and MUST get the
# JSON-LD document back — if it gets the UI's HTML instead, federation breaks. So this proxy
# routes any request whose Accept header asks for an ActivityPub media type to the backend, and
# everything else to the UI. The UI's browser requests send `Accept: text/html`, so they still
# get SSR pages. The lemmy backend ALSO serves /static/* for its ActivityPub content documents,
# but those are only fetched by remote instances via the Accept-header path above (the UI's own
# /static/* asset bundles are what local browsers need).
#
# TLS is terminated by the EXTERNAL nginx (this host's Docker can't easily do TLS termination
# inside compose). We forward X-Forwarded-Proto: https so the lemmy-ui SSR (and the backend)
# generate https://lemmy.luit.ink IRIs — required for federation. The lemmy backend has
# tls_enabled: true in its config, which makes it trust that header.

upstream lemmy_backend {
    server lemmy-1:8536;
    keepalive 16;
}

upstream lemmy_ui {
    server ui-1:1234;
    keepalive 16;
}

# The UI's node SSR process calls the backend at http://lemmy-1:8536 directly (container name on
# the shared Docker network) — it does NOT go through this proxy. See LEMMY_UI_LEMMY_INTERNAL_HOST.
server {
    # Container port 8082; compose maps host 8091 -> this (the external proxy targets host 8091).
    listen 8082;
    server_name _;

    # Lemmy API + ActivityPub payloads can exceed the 1MB nginx default (e.g. image posts,
    # large community documents during federation).
    client_max_body_size 50m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # REST API.
    location /api/ {
        proxy_pass http://lemmy_backend;
        proxy_read_timeout 120s;
    }

    # Federation discovery + ActivityPub well-known documents.
    location /.well-known/ {
        proxy_pass http://lemmy_backend;
    }

    # Static UI assets (hashed bundles). The UI serves these itself; the backend's /static/
    # (ActivityPub documents) is only hit via the Accept-header path below.
    location /static/ {
        proxy_pass http://lemmy_ui;
    }

    # ACTIVITYPUB CONTENT-NEGOTIATION (see header comment): any request asking for an
    # ActivityPub media type is an actor/object document fetch from a REMOTE instance (e.g.
    # Iris), so it goes to the backend. $http_accept is the raw Accept header; the regex
    # matches "application/activity+json", "application/ld+json", and "*/+json" style apub types.
    # Browser UI requests send Accept: text/html and fall through to the UI location below.
    location / {
        if ($http_accept ~* "(application/activity\\+json|application/ld\\+json)") {
            proxy_pass http://lemmy_backend;
        }
        proxy_pass http://lemmy_ui;
        proxy_read_timeout 120s;
    }
}
