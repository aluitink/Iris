# Phase 8 sample Docker composition: two real Iris ActivityPub servers + the Blazor WebAssembly
# "server explorer" on an internal Docker network, exercising cross-container federation over genuine
# network I/O (not in-process TestServer).
#
# Topology (see docs/DEPLOYMENT.md):
#   iris-a  → iris-a:8080   actor alice / community iris   (the "home" instance)
#   iris-b  → iris-b:8080   actor alice / community iris   (the "remote" instance)
#   iris-ui → iris-ui:8090  the Blazor WebAssembly server-explorer (static site on an ASP.NET Core static-file host)
#
# Each server container's Iris__HostName is its service name and Iris__Port is the real in-network
# port (8080), so the server's advertised base URI (the actor/community IRIs) is routable from the
# other container. The two instances resolve each other by hostname (iris-a / iris-b) via Docker's
# built-in DNS. Port mappings (8081/8082 → 8080, 8090 → 8090) expose the instances + the UI on the
# host for the smoke test / manual inspection; the in-container federation uses the service names,
# not the host mappings.
#
# Iris__PeerBase points each instance at the *other* instance's in-network base address (iris-a
# → http://iris-b:8080, and vice versa). The sample server's FederatedActorDocumentFetcher uses it to
# resolve the peer's actor key over the network when validating a peer signature or delivering to a
# peer actor — what makes the S10 signed cross-container federation (a real Follow a→b) + the proxy
# fallback work over genuine sockets.
#
# The explorer (iris-ui) is a browser app: the browser (on the host) dials the servers on their
# host-published ports (8081/8082) or the operator's own address — the InstanceBaseUrls surface
# (SAMPLE_PLAN §4.4) pre-fills a known base URL. The iris-ui service itself only needs to serve the
# static WASM site; it reaches nothing at runtime (all ActivityPub I/O is browser → server).
#
# Run:    docker compose -f docker-compose.yml up --build -d
# Smoke:  ./scripts/docker-smoke-test.sh
# Tear:   docker compose -f docker-compose.yml down

services:
  iris-a:
    build:
      context: .
      dockerfile: samples/SampleServer/Dockerfile
    container_name: iris-a
    hostname: iris-a
    environment:
      Iris__HostName: iris-a
      Iris__Port: "8080"
      Iris__Https: "false"
      Iris__Actor: alice
      # The peer (iris-b) in-network base: lets iris-a resolve iris-b's actor key over the network
      # (S10 signed cross-container federation + proxy fallback).
      Iris__PeerBase: http://iris-b:8080
      # The S10 smoke test drives a signed cross-container Follow from iris-a's alice, which requires
      # signing with alice's private key. curl cannot produce an ActivityPub HTTP signature, so the
      # smoke test runs an IrisSigner helper that signs with the key; Iris__DumpKeyTo dumps the key's
      # private-key PEM to a local path so the helper can read it. Sample-only, opt-in, local — no
      # secret is committed, and a production instance never sets this.
      Iris__DumpKeyTo: /tmp/iris-alice-key.pem
    ports:
      - "8081:8080"
    healthcheck:
      # A public WebFinger GET (RFC 8410 root path) — skips signature validation, so it is a clean
      # liveness probe. (curl is not in the aspnet base image, so the probe uses a TCP connect.)
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - iris-net

  iris-b:
    build:
      context: .
      dockerfile: samples/SampleServer/Dockerfile
    container_name: iris-b
    hostname: iris-b
    environment:
      Iris__HostName: iris-b
      Iris__Port: "8080"
      Iris__Https: "false"
      Iris__Actor: alice
      # The peer (iris-a) in-network base: lets iris-b resolve iris-a's actor key over the network
      # (S10 signed cross-container federation + proxy fallback).
      Iris__PeerBase: http://iris-a:8080
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - iris-net

  iris-ui:
    # The Blazor WebAssembly "server explorer" (Deliverable B) served as a static site by a minimal
    # ASP.NET Core static-file host (Kestrel on 8090). It dials the two servers from the browser
    # (host-published ports 8081/8082), so the service itself needs no outbound network access — it
    # only serves the WASM site. Routable as `iris-ui` on the internal network and published to the
    # host on 8090 for the smoke test / manual use.
    build:
      context: .
      dockerfile: samples/SampleBlazorClient/Dockerfile
    container_name: iris-ui
    hostname: iris-ui
    ports:
      - "8090:8090"
    healthcheck:
      # A TCP connect to the static host's port (the aspnet base image has no curl/wget); a successful
      # connect means the Kestrel web server is listening (the same liveness probe as iris-a/iris-b).
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8090' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - iris-net

networks:
  iris-net:
    driver: bridge
